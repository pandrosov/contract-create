services:
  db:
    image: postgres:15
    container_name: contract-db
    restart: always
    environment:
      POSTGRES_USER: contract_user
      POSTGRES_PASSWORD: contract_pass
      POSTGRES_DB: contract_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_user -d contract_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: contract-backend
    environment:
      DATABASE_URL: postgresql://contract_user:contract_pass@db:5432/contract_db
      SECRET_KEY: local-dev-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost:3131,http://127.0.0.1:3131
      COOKIE_SECURE: "false"
      TEMPLATES_DIR: templates
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >
      sh -c "python scripts/database/init_db.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: contract-frontend
    depends_on:
      - backend
    ports:
      - "3131:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      # Можно добавить node_modules, если нужно ускорить npm install:
      # - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  pgdata: